name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: false
        default: staging

# One deploy at a time per environment, and never cancel a running one: a
# deploy cancelled halfway has already removed the old containers and not yet
# started the new ones.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The deploy builds images from a known commit, so the tree that
          # ships is the tree that was verified. A shallow clone is enough
          # and keeps the runner's disk usage down — this box is shared.
          fetch-depth: 1

      - name: Reclaim disk space
        # The build produces four images of roughly 1.5 GB each. The runner
        # shares a volume with the running deployment and three other
        # projects, so the space has to be found before it is needed. The
        # reclaimable set is narrow on purpose: dangling images and the build
        # cache, which are outputs of a build rather than anything a running
        # service depends on.
        run: |
          set -uo pipefail
          df -h / | tail -1
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
          AVAIL=$(df --output=avail -k / | tail -1 | tr -d ' ')
          if [ "$AVAIL" -lt 8388608 ]; then
            echo "only $((AVAIL / 1024)) MiB free; the build needs roughly 8 GiB" >&2
            exit 1
          fi

      - name: Copy the verified tree onto the host
        # The deployment lives in a fixed directory on this host, and that
        # directory holds the env file with the permit signing key and the
        # audit HMAC key. Those two values must not change: rotating the
        # signing key invalidates every permit already issued, and rotating
        # the audit key breaks the existing audit chain.
        #
        # So the source is copied over and the env file is left alone. The
        # script's own upgrade path adds the settings an older host is
        # missing, without touching the ones it already has.
        run: |
          set -euo pipefail
          DEPLOY_DIR="${PZ_DEPLOY_DIR:-$HOME/permitzero}"
          echo "deploying ${{ github.sha }} to $DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          # --delete keeps the target a faithful copy of the verified commit,
          # so a file removed from the repository is removed from the host
          # too. The excludes are the two things that belong to the host
          # rather than to the repository: the env file and the runtime
          # state the seed writes.
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'infra/deploy/permitzero.env' \
            --exclude 'storage/' \
            --exclude 'node_modules/' \
            "${GITHUB_WORKSPACE}/" "$DEPLOY_DIR/"
          echo "tree copied"
          ls "$DEPLOY_DIR/infra/migrations/" | tail -3

      - name: Deploy
        run: |
          set -euo pipefail
          cd "${PZ_DEPLOY_DIR:-$HOME/permitzero}"
          ./infra/deploy/deploy-vps.sh

      - name: Verify the deployment
        run: |
          set -euo pipefail
          # The script already verified readiness and tenant isolation from
          # inside the compose network. This is the second opinion from
          # outside, through the edge, exactly as a visitor would arrive.
          for i in $(seq 1 30); do
            code=$(curl -sk -o /tmp/pz-verify.json -w '%{http_code}' \
              --resolve permitzero.svalley.tech:8450:127.0.0.1 \
              https://permitzero.svalley.tech:8450/health/ready || echo 000)
            if [ "$code" = "200" ]; then
              echo "readiness: $(cat /tmp/pz-verify.json)"
              exit 0
            fi
            echo "attempt $i: /health/ready returned $code"
            sleep 5
          done
          echo "the deployment did not become ready" >&2
          cat /tmp/pz-verify.json >&2 2>/dev/null || true
          exit 1

      - name: Verify tenant isolation from the database
        # The deployment script checks this from inside the compose network.
        # This checks it again, from outside, against the running container —
        # because the property is about the database, and the only way to be
        # sure is to ask the database what a runtime role with no tenant
        # context can see.
        run: |
          set -euo pipefail
          cd "${PZ_DEPLOY_DIR:-$HOME/permitzero}"
          COMPOSE="docker compose --env-file infra/deploy/permitzero.env -f infra/docker-compose.yml"
          ROWS=$($COMPOSE exec -T postgres psql -U pz_app -d "$PZ_PG_DB" -t -A -c \
            "SELECT count(*) FROM audit_events;" 2>&1 | tr -d '[:space:]')
          echo "audit rows visible to the runtime role with no tenant context: $ROWS"
          if [ "$ROWS" != "0" ]; then
            echo "the deployment does NOT enforce tenant isolation" >&2
            exit 1
          fi
          echo "tenant isolation verified from the database"
