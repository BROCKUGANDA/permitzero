name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (typecheck, lint, tests, build, format)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: |
          sed -i 's/^DATABASE_URL=.*/DATABASE_URL=postgres:\/\/postgres:postgres@127.0.0.1:5432\/permitzero/' .env
          sed -i 's/^DATABASE_URL_TEST=.*/DATABASE_URL_TEST=postgres:\/\/postgres:postgres@127.0.0.1:5432\/permitzero_test/' .env
          sed -i 's/^REDIS_URL=.*/REDIS_URL=redis:\/\/127.0.0.1:6379/' .env
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run verify -- --strict
      - run: npm run secret:scan
      # Dependency vulnerabilities, gated by named exception rather than by a
      # threshold that the current tree already fails. Fails on anything that is
      # not individually justified in infra/security/dependency-exceptions.json,
      # and on a listed exception whose review date has passed.
      - run: npm run audit:gate
      # The outage drill runs against the CI Postgres/Redis services, so the
      # resilience claims in the README are measured on every push.
      - run: npm run drill:resilience
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/permitzero_test
          PZ_RLS_ROLE_PASSWORD: pz_app_dev

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
