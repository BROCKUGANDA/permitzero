name: Main gate

# The reconciliation for a commit that reaches main without a CI run.
#
# A merge performed with the repository's GITHUB_TOKEN does not trigger a push
# workflow, so a commit landed that way has no CI run of its own. The
# Auto-promote workflow dispatches one as soon as it sees the merge — but a
# merge can land long after that step ran, because GitHub's auto-merge queue
# applies the branch protection rules itself and the pull request can sit
# behind a human's approval for hours.
#
# This workflow closes that gap. It runs on a schedule, and it does one thing:
# if main's HEAD has no CI run that can satisfy the Deploy workflow's gate, it
# dispatches one.
#
# It is a reconciliation, not a gate. The gate is still CI's own result: this
# workflow cannot make a commit pass, it can only make sure the commit is
# TESTED. A commit whose CI fails stays undeployable, and the Deploy
# workflow refuses it.
on:
  schedule:
    # Every fifteen minutes. The Deploy workflow's own gate is what keeps an
    # unverified commit from shipping, so this interval is how long a commit
    # can sit on main untested — not how long it can sit undeployed, which is
    # the Deploy workflow's own decision.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Dispatching CI is the whole point of this workflow.
  actions: write

jobs:
  reconcile:
    name: Make sure main's head is gated
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Dispatch CI if main is ungated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          HEAD_SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha' 2>/dev/null || echo "")
          if [ -z "$HEAD_SHA" ]; then
            echo "could not read main's head commit" >&2
            exit 1
          fi
          echo "main is at $HEAD_SHA"

          # A run that can satisfy the Deploy workflow's gate: a CI run on
          # main that either succeeded or is still running. A cancelled run,
          # or one made against a pull request's merge ref, cannot — and
          # counting those would leave main ungated while this workflow
          # reported that it was already covered.
          USABLE=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "CI" and (.event == "push" or .event == "workflow_dispatch") and (.conclusion == "success" or .conclusion == null))] | length' \
            2>/dev/null || echo "")
          if [ "${USABLE:-0}" != "0" ]; then
            echo "main's head is already gated by a usable CI run; nothing to do"
            exit 0
          fi

          echo "main's head has no usable CI run; dispatching one"
          gh workflow run ci.yml --ref main \
            || { echo "could not dispatch CI for $HEAD_SHA" >&2; exit 1; }
          echo "CI dispatched for $HEAD_SHA"
