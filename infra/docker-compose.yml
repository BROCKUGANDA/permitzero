# PermitZero — full stack.
#
# One file, two uses:
#   · local development  → `docker compose -f infra/docker-compose.yml up -d postgres redis`
#   · the VPS deployment → `docker compose --env-file deploy/permitzero.env -f docker-compose.yml up -d`
#
# Every long-running service publishes NOTHING on the host. Only Caddy answers
# on loopback ports, and only the shared L4 front door reaches those. That is
# the whole network boundary: nothing behind Caddy is reachable from outside.
#
# Secrets come from deploy/permitzero.env (gitignored). Nothing here carries a
# value, and a missing one fails the parse rather than silently defaulting.

name: permitzero

# The env file every service receives.
#
# It is named by PZ_APP_ENV_FILE so the deployment can point it at a location
# OUTSIDE the checked-out tree. The reason is that `actions/checkout` removes
# untracked and ignored files, so an env file inside the tree would be
# erased by the next checkout — taking the permit signing key and the audit
# HMAC key with it, and leaving the script to generate NEW ones against the
# existing database. Every previously issued permit would stop verifying and
# the existing audit chain would stop verifying.
#
# The default is the in-tree path, which is right for a local deployment and
# for the first run on a host.
x-app-env: &app-env
  env_file:
    - ${PZ_APP_ENV_FILE:-deploy/permitzero.env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PZ_PG_USER:?}
      POSTGRES_PASSWORD: ${PZ_PG_PASSWORD:?}
      POSTGRES_DB: ${PZ_PG_DB:?}
      # Deterministic collation so index planning does not drift between hosts.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PZ_PG_USER} -d ${PZ_PG_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=80
      - -c
      - log_min_duration_statement=250

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot. Seeds synthetic demo data only when PZ_SEED=1; refuses in
  # production, which is why the demo runs with APP_ENV=staging.
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: migrate
    image: permitzero/migrate:local
    restart: 'no'
    <<: *app-env
    environment:
      PZ_SEED: ${PZ_SEED:-0}
    volumes:
      # The seed writes storage/demo-credentials.json. Without a bind mount
      # those tokens exist only inside the one-shot container's layer and are
      # gone when it exits — so the demo scenario and the console sign-in
      # would have nothing to read.
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: api
    image: permitzero/api:local
    # Must exceed SHUTDOWN_GRACE_MS in the env file, or the container is
    # killed while it is still draining.
    stop_grace_period: 20s
    restart: unless-stopped
    <<: *app-env
    # No storage mount on purpose: the running API never needs the demo
    # bearer tokens. Only the one-shot scenario harness reads them, and it
    # reads them as an operator action.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: worker
    image: permitzero/worker:local
    # Must exceed SHUTDOWN_GRACE_MS in the env file, or the container is
    # killed while it is still draining.
    stop_grace_period: 20s
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: web
    image: permitzero/web:local
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

  # One-shot release gate. `build` carries dev dependencies and the source, so
  # this is the only place the full suite can run: unit + integration + the
  # corpus release gate, against a real PostgreSQL test database rather than a
  # mock. Compose never starts it; `docker compose run --rm verify` does.
  verify:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: build
    image: permitzero/verify:local
    restart: 'no'
    profiles: ['test']
    <<: *app-env
    environment:
      DATABASE_URL_TEST: postgres://permitzero:${PZ_PG_PASSWORD:?}@postgres:5432/permitzero_test
      # The test harness derives the restricted pz_app URL from DATABASE_URL_TEST
      # and connects with this password, which is the one 0006 assigns. Without it
      # the suite would fall back to the exempt admin role and every
      # tenant-isolation assertion would pass while proving nothing.
      PZ_RLS_ROLE_PASSWORD: ${PZ_RLS_ROLE_PASSWORD:-pz_app_dev}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'vitest', 'run', '--reporter=dot']

  # Named `edge`, not `caddy`, on purpose. A leftover host cron belonging to
  # another project (`/usr/local/bin/crucible-edge-attach`) attaches every
  # running container whose name matches /caddy/i to `crucible_default`. That
  # makes crucible's own `web` and `api` services resolve instead of ours, and
  # this site then answers 502/503 while every container here reports healthy —
  # the exact failure mode the ASTROLABE edge documents and moved away from.
  # Scraped over this compose network only; no published port, so the metrics
  # endpoint never has a path in from the internet. Starts only with
  # `--profile observability`, because a demo deployment without a Prometheus has
  # nothing to feed it and an empty target list is a warning nobody reads.
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    profiles: ['observability']
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - observability_secrets:/run/secrets:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The lifecycle API is left at its default, which is disabled. It was
      # previously written as `--web.enable-lifecycle=false`, and Prometheus's
      # flag parser rejects a boolean flag written with an explicit `=false`:
      # it reads "false" as a stray positional argument and exits with
      # "unexpected false". The container crash-looped on every start.
    depends_on:
      - alertmanager
  # Where a firing rule actually goes. Prometheus evaluating a rule and then
  # doing nothing with the result is not an alerting system; this is the
  # component that makes `severity: page` mean something.
  #
  # The config is RENDERED ON THE HOST rather than expanded inside the
  # container: the deployment script substitutes the webhook URL into
  # `alertmanager.yml.template` and writes the result to a gitignored path.
  # An envsubst entrypoint would depend on which utilities a particular
  # upstream image happens to ship, and a base-image change would then break
  # alerting silently.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ['observability']
    volumes:
      - observability_secrets:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager

  # The rendered observability files, made readable by the containers that
  # consume them.
  #
  # Prometheus and Alertmanager both run as `nobody` (65534), and the files
  # the deployment script renders are mode 0600 owned by the deploying user.
  # A bind mount carries the host's ownership and mode into the container, so
  # the containers could not read them: Prometheus could not load its scrape
  # token and Alertmanager could not load its configuration at all.
  #
  # `chown` on the host is not an option either — the deployment runs as an
  # unprivileged user and cannot change ownership. So the files are COPIED
  # into a named volume by a one-shot container that runs as root INSIDE
  # its own namespace, and that volume is what the observability containers
  # mount. The host files keep their restrictive mode; only the copy inside
  # the volume is group-readable, and only by uid 65534.
  observability-secrets:
    image: busybox:1.36
    restart: 'no'
    profiles: ['observability']
    user: '0:0'
    volumes:
      - ../run:/source:ro
      - observability_secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -e
        cp /source/pz_metrics_token /secrets/pz_metrics_token
        cp /source/alertmanager.yml /secrets/alertmanager.yml
        chown 65534:65534 /secrets/pz_metrics_token /secrets/alertmanager.yml
        chmod 640 /secrets/pz_metrics_token /secrets/alertmanager.yml
        echo "observability secrets staged for uid 65534"

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '127.0.0.1:${PZ_HTTP_PORT:-8050}:80'
      - '127.0.0.1:${PZ_HTTPS_PORT:-8450}:443'
    environment:
      PZ_HOSTNAMES: ${PZ_HOSTNAMES:?}
      PZ_OPS_HOSTNAME: ${PZ_OPS_HOSTNAME:-}
      PZ_ACME_EMAIL: ${PZ_ACME_EMAIL:?}
    depends_on:
      web:
        condition: service_started

  # Origin transport. The connector dials out; nothing dials in.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${PZ_TUNNEL_TOKEN:-}']
    depends_on:
      edge:
        condition: service_started
    profiles: ['tunnel']

volumes:
  # Explicit provenance keeps the janitor from confusing retained production
  # data with anonymous CI service-container volumes.
  pgdata:
    labels:
      com.permitzero.owner: production
  redisdata:
    labels:
      com.permitzero.owner: production
  caddy_data:
    labels:
      com.permitzero.owner: production
  caddy_config:
    labels:
      com.permitzero.owner: production
  prometheus_data:
    labels:
      com.permitzero.owner: production
  alertmanager_data:
    labels:
      com.permitzero.owner: production
  observability_secrets:
    labels:
      com.permitzero.owner: production
